  build_and_release:

      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4
        - name: set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: gradle

        - name: Create debug keystore
          run: |
            mkdir -p $HOME/.android
            echo "$ANDROID_SDK_ROOT" > $HOME/.android/repositories.cfg
            echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > $HOME/.android/debug.keystore

        #      - name: Run unit tests
        #        run: ./gradlew test
        #      - name: Upload test report directory
        #        uses: actions/upload-artifact@v3
        #        with:
        #          name: TestResults
        #          path: build/reports/tests/testDebugUnitTest/
        #      - name: Run lint
        #        run: ./gradlew lint
        #      - name: Upload lint report
        #        uses: actions/upload-artifact@v3
        #        with:
        #          name: LintResult
        #          path: build/reports/lint-results*.html
        
        - name: Set Version Name
          id: app_version
          run: |
            echo "VERSION_NAME=$(./gradlew -q versionName)" >> $GITHUB_OUTPUT
        
        # - name: Build with Gradle
        #   run: ./gradlew clean build
        
        - name: Check if Release Exists
          id: check_release
          run: |
            if gh release view "v.${{ steps.app_version.outputs.VERSION_NAME }}" &> /dev/null; then
              echo "RELEASE_EXISTS=true" >> $GITHUB_OUTPUT
            else
              echo "RELEASE_EXISTS=false" >> $GITHUB_OUTPUT
            fi
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Release Exists
          run: echo "${{ steps.check_release.outputs.RELEASE_EXISTS }}"
        
        - name: Create Release
          if: ${{ steps.check_release.outputs.RELEASE_EXISTS == 'false' }}
          id: create_release
          run: |
            echo "New release"
            # gh release create "v.${{ steps.app_version.outputs.VERSION_NAME }}" --title "Release v.${{ steps.app_version.outputs.VERSION_NAME }}"
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Update Release
          if: ${{ steps.check_release.outputs.RELEASE_EXISTS == 'true' }}
          id: update_release
          run: |
            echo "Update release"
            # gh release edit "v.${{ steps.app_version.outputs.VERSION_NAME }}" --title "Release v.${{ steps.app_version.outputs.VERSION_NAME }}"
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Upload Artifacts
          id: upload_artifacts
          run: |
            set -e  # Exit immediately if any command returns a non-zero status
            release_tag="v.${{steps.app_version.outputs.VERSION_NAME}}"
            debug_apk=$(find app/build/outputs/apk/debug -name "*.apk")
            release_apk=$(find app/build/outputs/apk/release -name "*.apk")
            if [[ -z "$debug_apk" || -z "$release_apk" ]]; then
             echo "Error: APK files not found."
             exit 1
            fi
#            gh release upload $release_tag $debug_apk $release_apk --clobber
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
